name: SystAudit Tests

on:
  push:
    branches:
      - master
      - feature/network-info
      - feature/saas-foundation
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Run Django system check
        run: python saas/manage.py check

      - name: Run Django licensing tests
        run: python saas/manage.py test licensing