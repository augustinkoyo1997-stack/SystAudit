name: SystAudit Tests

on:
  push:
    branches:
      - master
      - feature/network-info
      - feature/saas-foundation
      - feature/dashboard-ui

  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sysaudit_db
          POSTGRES_USER: sysaudit_user
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sysaudit_user -d sysaudit_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SECRET_KEY: "ci-only-development-key-not-for-production"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:8000,http://localhost:8000"

      POSTGRES_DB: sysaudit_db
      POSTGRES_USER: sysaudit_user
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Run Django system check
        run: python saas/manage.py check

      - name: Run Django licensing tests
        run: python saas/manage.py test licensing