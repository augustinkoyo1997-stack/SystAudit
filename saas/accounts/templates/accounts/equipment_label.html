<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étiquette {{ computer.asset_tag }}</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#111}
.toolbar{padding:12px;text-align:center}
.toolbar button{padding:9px 16px;font-size:14px;cursor:pointer}
.label{width:62mm;margin:10px auto;padding:4mm;background:#fff;border:1px solid #333;text-align:center}
.label img{width:46mm;height:46mm}
.tag{font-size:15px;font-weight:700;letter-spacing:.05em;margin-top:2mm}
.name{font-size:11px;margin-top:1mm;overflow-wrap:anywhere}
.hint{font-size:8px;color:#555;margin-top:2mm}
@media print{body{background:#fff}.toolbar{display:none}.label{margin:0;border:1px solid #000}}
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">Imprimer l'étiquette</button></div>
<div class="label">
{% if qr_code_data %}<img src="data:image/svg+xml;base64,{{ qr_code_data }}" alt="QR code {{ computer.asset_tag }}">{% else %}<p>QR indisponible : installez la dépendance « qrcode ».</p>{% endif %}
<div class="tag">{{ computer.asset_tag }}</div>
<div class="name">{{ computer.name }}</div>
<div class="hint">Scanner pour voir l'historique (connexion SystAudit requise)</div>
</div>
</body>
</html>
