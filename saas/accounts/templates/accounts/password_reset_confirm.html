<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choisir un nouveau mot de passe — SystAudit</title>
</head>
<body>
    <main>
        {% if validlink %}
            <h1>Choisir un nouveau mot de passe</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Enregistrer le mot de passe</button>
            </form>
        {% else %}
            <h1>Lien invalide ou expiré</h1>
            <p>Demandez un nouveau lien de réinitialisation pour continuer.</p>
            <a href="{% url 'password_reset' %}">Demander un nouveau lien</a>
        {% endif %}
    </main>
</body>
</html>
