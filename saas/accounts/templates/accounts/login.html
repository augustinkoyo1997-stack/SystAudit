<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SystAudit</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e3a8a);
        color: #1e293b;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
        margin: 20px;
    }

    .login-card {
        background: #ffffff;
        border-radius: 18px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 15px;
        border-radius: 16px;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 30px;
        font-weight: bold;
    }

    .logo h1 {
        font-size: 28px;
        color: #0f172a;
        margin-bottom: 8px;
    }

    .logo p {
        color: #64748b;
        font-size: 14px;
    }

    form p {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .errorlist {
        list-style: none;
        color: #dc2626;
        font-size: 13px;
        margin-bottom: 12px;
    }

    .login-button {
        width: 100%;
        border: none;
        padding: 14px;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
    }

    .login-button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
    }

    .register-link {
        text-align: center;
        margin-top: 25px;
        color: #64748b;
        font-size: 14px;
    }

    .register-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    .footer {
        text-align: center;
        margin-top: 20px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
    }
</style>
```

</head>

<body>
    <div class="login-container">

```
    <div class="login-card">

        <div class="logo">
            <div class="logo-icon">S</div>
            <h1>SystAudit</h1>
            <p>Protection et audit de votre système</p>
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="login-button">
                Se connecter
            </button>
        </form>

        <div class="register-link">
            Pas encore de compte ?
            <a href="{% url 'register' %}">Créer un compte</a>
        </div>

    </div>

    <div class="footer">
        © 2026 SystAudit — Security made simple
    </div>

</div>
```

</body>
</html>
