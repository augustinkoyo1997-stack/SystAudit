<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Récupérer mon compte — SystAudit</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06101d; color: #f5f9ff; font: 16px Arial, sans-serif; }
        main { width: min(440px, calc(100% - 40px)); padding: 32px; border: 1px solid #263b52; border-radius: 18px; background: #0c1929; }
        input { box-sizing: border-box; width: 100%; margin: 8px 0 18px; padding: 13px; border: 1px solid #263b52; border-radius: 9px; background: #081522; color: white; }
        button { width: 100%; padding: 13px; border: 0; border-radius: 9px; background: #008fe0; color: white; font-weight: bold; cursor: pointer; }
        a { color: #42c4ff; }
        .errors { color: #ff8d9a; }
    </style>
</head>
<body>
<main>
    <h1>Mot de passe oublié ?</h1>
    <p>Saisissez l’adresse e-mail liée à votre compte. Nous vous enverrons un lien de réinitialisation si un compte correspondant existe.</p>
    <form method="post">
        {% csrf_token %}
        <label for="id_email">Adresse e-mail</label>
        <input type="email" name="email" id="id_email" autocomplete="email" required>
        {% if form.email.errors %}<div class="errors">{{ form.email.errors }}</div>{% endif %}
        <button type="submit">Envoyer le lien</button>
    </form>
    <p><a href="{% url 'login' %}">Retour à la connexion</a></p>
</main>
</body>
</html>
